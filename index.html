<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>废钢管理系统 v5.1</title>
<style>
:root{--p:#2563eb;--pd:#1d4ed8;--r:#dc2626;--g:#16a34a;--w:#ea580c;--bg:#f1f5f9;--c:#fff;--t:#0f172a;--t2:#64748b;--b:#e2e8f0;--rd:12px;--sh:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.5;min-height:100vh}
.hdr{background:linear-gradient(135deg,#0f172a,#1e3a5f,#2563eb);color:#fff;padding:12px 20px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hl h1{font-size:18px;font-weight:700}.hl .sub{font-size:11px;opacity:.7;margin-top:2px}
.hr{text-align:right;font-size:12px;opacity:.9;display:flex;flex-direction:column;align-items:flex-end}
.hr .ct{font-size:24px;font-weight:700;letter-spacing:1px}.hr .cd{font-size:11px;opacity:.7}
.tn{display:flex;background:var(--c);border-bottom:1px solid var(--b);overflow-x:auto;position:sticky;top:76px;z-index:99;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:0 8px}
.tn::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;padding:12px 14px;font-size:13px;border:none;background:none;cursor:pointer;white-space:nowrap;color:var(--t2);border-bottom:3px solid transparent;transition:all .15s;position:relative;font-weight:500}
.tb:hover{color:var(--p);background:rgba(37,99,235,.04)}
.tb.active{color:var(--p);border-bottom-color:var(--p);font-weight:700;background:rgba(37,99,235,.06)}
.tb .badge{position:absolute;top:4px;right:2px;background:var(--r);color:#fff;font-size:9px;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;padding:0 5px;animation:bp 2.5s infinite}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.main{max-width:100%;margin:0 auto;padding:10px 10px}
@media(min-width:1200px){.main{max-width:96vw}}
.card{background:var(--c);border-radius:var(--rd);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;border:1px solid var(--b)}
.ch{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#fafbfc}
.ch h3{font-size:14px;font-weight:700}.cb{padding:14px 18px}.cb.np{padding:0}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.dc{background:var(--c);border-radius:var(--rd);box-shadow:var(--sh);padding:14px 10px;text-align:center;border:1px solid var(--b);transition:all .15s}
.dc:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.dc .num{font-size:24px;font-weight:700;color:var(--p)}.dc .num.d{color:var(--r)}.dc .num.s{color:var(--g)}.dc .num.w{color:var(--w)}
.dc .lbl{font-size:11px;color:var(--t2);margin-top:3px;font-weight:500}.dc .sn{font-size:11px;color:var(--t2);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:7px;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s;white-space:nowrap}
.bp{background:var(--p);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.3)}.bp:hover{background:#1d4ed8;box-shadow:0 2px 6px rgba(37,99,235,.4)}.bd{background:var(--r);color:#fff}.bd:hover{background:#b91c1c}.bo{background:var(--c);border:1px solid var(--b);color:var(--t)}.bo:hover{background:#f8fafc;border-color:#94a3b8}
.bs{padding:5px 10px;font-size:12px;border-radius:5px}.bxs{padding:3px 8px;font-size:11px;border-radius:4px}
.btn-info{background:#0ea5e9;color:#fff;box-shadow:0 1px 2px rgba(14,165,233,.3)}.btn-info:hover{background:#0284c7}
.fg{margin-bottom:10px}.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:3px;color:var(--t2)}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 12px;border:1px solid var(--b);border-radius:7px;font-size:13px;font-family:inherit;transition:all .15s;background:#fafbfc}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,.1);background:#fff}
.fg textarea{resize:vertical;min-height:50px}.fh{font-size:11px;color:var(--t2);margin-top:2px;display:block}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fr3{grid-template-columns:1fr 1fr 1fr}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin:0 auto}
th{background:#f1f5f9;padding:10px 12px;text-align:center;font-weight:700;white-space:nowrap;border-bottom:2px solid #cbd5e1;font-size:11.5px;color:var(--t2);letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;text-align:center;font-size:12.5px}
tr:hover td{background:#f8fafc}.tr{text-align:right}.tc{text-align:center}.tl{text-align:left}
.bad{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600}
.bad-ur{background:#fef2f2;color:#dc2626}.bad-pr{background:#fffbeb;color:#ea580c}
.bad-ru{background:#eff6ff;color:#2563eb}.bad-ok{background:#f0fdf4;color:#16a34a}.bad-em{background:#f8fafc;color:#94a3b8}
.ri{padding:12px 16px;margin-bottom:4px;border-radius:8px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.ri:hover{filter:brightness(.97);border-color:rgba(0,0,0,.06)}
.ri-urg{border-left:4px solid var(--r);background:#fff5f5}
.ri-war{border-left:4px solid var(--w);background:#fffcf5}
.ri-inf{border-left:4px solid var(--p);background:#f5f8ff}
.ri-plant{background:#fff5f5;border-left-color:#dc2626}.ri-driver{background:#fffcf5;border-left-color:#ea580c}.ri-loan{background:#f5f8ff;border-left-color:#2563eb}.ri-interest{background:#fefce8;border-left-color:#ca8a04}.ri-price{background:#f5fff5;border-left-color:#16a34a}.ri-risk{background:#fff5fa;border-left-color:#db2777}.ri-long{background:#fff0f0;border-left-color:#b91c1c}
.ri-ic{font-size:20px;flex-shrink:0;margin-top:1px}
.ri-bd{flex:1;font-size:13px;line-height:1.5}.ri-tl{font-weight:600}.ri-dt{color:var(--t2);font-size:12px}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal-mask.show{display:flex}
.modal{background:var(--c);border-radius:var(--rd) var(--rd) 0 0;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;padding:20px;animation:su .25s ease;box-shadow:0 -4px 24px rgba(0,0,0,.1)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h3{font-size:16px;font-weight:700}.mc{background:none;border:none;font-size:22px;cursor:pointer;color:var(--t2);padding:4px 8px;border-radius:6px;transition:all .15s}.mc:hover{background:#f1f5f9;color:var(--t)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:24px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:500}.toast.show{opacity:1}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;background:var(--c);padding:10px 14px;border-radius:var(--rd);border:1px solid var(--b);box-shadow:var(--sh)}
.fb select,.fb input{padding:7px 10px;border:1px solid var(--b);border-radius:7px;font-size:12.5px;background:#fafbfc}
.fb select:focus,.fb input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.empty{text-align:center;padding:40px;color:var(--t2);font-size:13px}.empty .icon{font-size:40px;margin-bottom:8px}
.ss{border:1px solid var(--b);border-radius:var(--rd);padding:16px;margin-bottom:14px;background:#fafbfc}
.ss h4{font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:6px}
.ad{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.ah{background:#16a34a}.aw{background:var(--w)}.ac{background:#94a3b8}.ad2{background:#f8fafc;border:1px solid #cbd5e1}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin:2px 2px}
.tag-g{background:#f0fdf4;color:#16a34a}.tag-r{background:#fef2f2;color:#dc2626}.tag-b{background:#eff6ff;color:#2563eb}.tag-y{background:#fffbeb;color:#ea580c}
.photo-preview{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--b);margin:2px;cursor:pointer;transition:transform .15s}.photo-preview:hover{transform:scale(1.05)}
.photo-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);background:var(--c);padding:8px 10px;border-radius:var(--rd);border:1px solid var(--b)}
.pg button{padding:4px 10px;border:1px solid var(--b);border-radius:5px;background:var(--c);cursor:pointer;font-size:12px;transition:all .15s}
.pg button:hover{background:#f1f5f9;border-color:var(--p)}.pg button:disabled{opacity:.3;cursor:not-allowed}
.pg select{padding:4px 8px;border:1px solid var(--b);border-radius:5px;font-size:12px}
.sum-row{background:#f8fafc;font-weight:700;border-top:2px solid #cbd5e1}
.sum-row td{padding:10px 12px;font-weight:700;text-align:center;font-size:12.5px}
.btn-row{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap}
.btn-row .btn{font-size:11px;padding:3px 8px}
.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm 8mm}
  body{background:#fff;color:#000}
  .print-only{display:block}
  .no-print{display:none!important}
  .hdr,.tn,.btn,.fb,.modal-mask,.btn-row{display:none!important}
  .main{max-width:100%;padding:0}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;margin-bottom:6px}
  .ri,.pg{display:none!important}
  .dg{page-break-inside:avoid}
  .dc{border:1px solid #ddd}
  table{font-size:10px}
  th{background:#eee;border-bottom:1.5px solid #999;font-size:10px;padding:5px 6px}
  td{font-size:10px;padding:5px 6px}
  .sum-row td{background:#f0f0f0}
  .ch h3{font-size:12px}
  .bad{font-size:8px;padding:2px 6px}
  .pr-header{text-align:center;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #2563eb}
  .pr-header .pr-title{font-size:16px;font-weight:700;color:#0f172a;margin:0}
  .pr-header .pr-range{font-size:11px;color:#555;margin-top:2px}
  .pr-header .pr-meta{font-size:9px;color:#888;margin-top:1px}
}
@media(min-width:600px){.modal{border-radius:var(--rd);margin:40px auto;max-height:80vh}.modal-mask{align-items:center}}
</style>
</head>
<body>

<div class="hdr"><div class="hl"><h1>🏗️ 废钢管理系统 <span style="font-size:10px;opacity:.5;font-weight:400">v5.1</span></h1><div class="sub">报表 · 订单 · 资金 · 客户</div></div><div class="hr"><div class="ct" id="liveClock">--:--:--</div><div class="cd" id="liveDate">----年--月--日 星期-</div></div></div>

<div class="tn" id="tabNav">
  <button class="tb active" data-tab="report">📊 报表</button>
  <button class="tb" data-tab="orders">📋 订单</button>
  <button class="tb" data-tab="vehicles">🚛 车辆</button>
  <button class="tb" data-tab="plants">🏭 钢厂</button>
  <button class="tb" data-tab="capital">💰 资金</button>
  <button class="tb" data-tab="payers">👤 联系人</button>
  <button class="tb" data-tab="reminders">🔔 提醒</button>
  <button class="tb" data-tab="settings">⚙️ 设置</button>
</div>

<div class="main" id="mainContent"></div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script src="sync.js"></script>
<script>
// ==================== DB ====================
const DB={
  _pf:'steel_v5_',
  _tbls:['orders','vehicles','plants','capital','payers','reminders','settings'],
  _k(t){return this._pf+t},
  all(t){try{return JSON.parse(localStorage.getItem(this._k(t))||'[]')}catch{return[]}},
  get(t,id){return this.all(t).find(r=>r.id===id)},
  save(t,r){const l=this.all(t);const i=l.findIndex(x=>x.id===r.id);if(i>=0)l[i]=r;else l.unshift(r);localStorage.setItem(this._k(t),JSON.stringify(l));if(typeof Sync!=='undefined')Sync.markPending();return r},
  del(t,id){const l=this.all(t).filter(r=>r.id!==id);localStorage.setItem(this._k(t),JSON.stringify(l));if(typeof Sync!=='undefined')Sync.markPending()},
  q(t,fn){return this.all(t).filter(fn)},
  gid(){return'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)},
  getSetting(key,d){const s=this.all('settings').find(s=>s.key===key);return s?s.value:d},
  setSetting(key,v){const e=this.all('settings').find(s=>s.key===key);if(e){e.value=v;this.save('settings',e)}else this.save('settings',{id:this.gid(),key,value:v})}
};

// ==================== UTILS ====================
function fm(n){if(n==null||isNaN(n))return'¥0';return'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fn(n){if(n==null||isNaN(n))return'0';return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function fd(d){if(!d)return'-';const dt=new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function today(){return new Date().toISOString().split('T')[0]}
function nowISO(){return new Date().toISOString()}
function addDays(d,dy){const nd=new Date(d);nd.setDate(nd.getDate()+dy);return nd.toISOString().split('T')[0]}
function cm(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function db(d1,d2){const a=new Date(d1),b=new Date(d2);return Math.ceil((b-a)/(86400000))}
function st(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500)}
function weekStart(d){const dt=new Date(d),day=dt.getDay()||7;dt.setDate(dt.getDate()-day+1);return dt.toISOString().split('T')[0]}
function weekEnd(d){const dt=new Date(weekStart(d));dt.setDate(dt.getDate()+6);return dt.toISOString().split('T')[0]}
function monthStart(d){return d.substring(0,7)+'-01'}
function monthEnd(d){const[y,m]=d.substring(0,7).split('-').map(Number);return`${y}-${String(m).padStart(2,'0')}-${new Date(y,m,0).getDate()}`}
function quarterStart(d){const dt=new Date(d);const q=Math.floor(dt.getMonth()/3);return`${dt.getFullYear()}-${String(q*3+1).padStart(2,'0')}-01`}
function quarterEnd(d){const dt=new Date(d);const q=Math.floor(dt.getMonth()/3);const lm=q*3+3;return`${dt.getFullYear()}-${String(lm).padStart(2,'0')}-${new Date(dt.getFullYear(),lm,0).getDate()}`}
function halfYearStart(d){const dt=new Date(d);return`${dt.getFullYear()}-${dt.getMonth()<6?'01':'07'}-01`}
function halfYearEnd(d){const dt=new Date(d);return dt.getMonth()<6?`${dt.getFullYear()}-06-30`:`${dt.getFullYear()}-12-31`}
function yearStart(d){return d.substring(0,4)+'-01-01'}
function yearEnd(d){return d.substring(0,4)+'-12-31'}

const OS={unpaid_unreceived:{l:'未付未回',c:'bad-ur'},paid_unreceived:{l:'已付未回',c:'bad-pr'},received_unpaid:{l:'已回未付',c:'bad-ru'},completed:{l:'已完结',c:'bad-ok'}};
function sb(s){const o=OS[s]||OS.unpaid_unreceived;return`<span class="bad ${o.c}">${o.l}</span>`}
function infer(dd,rd){if(dd&&rd)return'completed';if(dd&&!rd)return'paid_unreceived';if(!dd&&rd)return'received_unpaid';return'unpaid_unreceived'}

// ==================== ACTION BUTTONS HELPER ====================
function actionBtns(id,type){
  return`<div class="btn-row"><button class="btn btn-info bxs" onclick="viewDetail('${type}','${id}')">查看</button><button class="btn bo bxs" onclick="editDetail('${type}','${id}')">编辑</button><button class="btn bd bxs" onclick="delDetail('${type}','${id}')">删</button></div>`;
}
function viewDetail(type,id){
  const data=DB.get(type,id);if(!data)return;
  let body='';
  if(type==='orders'){
    const v=DB.get('vehicles',data.vehicle_id),p=DB.get('plants',data.plant_id),py2=DB.all('payers');
    const s=data.settle_status||infer(data.settle_driver_date,data.plant_pay_date);
    const owner=data.owner_name||(py2.find(y=>y.id===data.payee_id)||{}).name||'-';
    const payer=(py2.find(y=>y.id===data.payer_id)||{}).name||'-';
    const payee=(py2.find(y=>y.id===data.payee_id)||{}).name||'-';
    const pp=parseFloat(data.unit_price)||0,dp=pp-(parseFloat(data.margin_per_ton||data.commission_per_ton)||0);
    body=`<div style="font-size:13px;line-height:2.2">
      <div><b>📅 日期：</b>${fd(data.order_date)} | <b>状态：</b>${(OS[s]||OS.unpaid_unreceived).l}</div>
      <div><b>🚛 车辆：</b>${v?v.plate_number+' - '+v.driver_name:'?'} | <b>🏭 钢厂：</b>${p?p.name:'?'}</div>
      <div><b>👤 货主：</b>${owner} | <b>🏷️ 等级：</b>${data.steel_grade||'-'} | <b>⚖️ 净重：</b>${fn(data.net_weight)}吨</div>
      <div style="background:#f8fafc;padding:8px;border-radius:6px;margin:6px 0">
        <b>回款单价：</b>${fm(pp)} → <b>回款总价：</b>${fm(data.total_amount)}<br>
        <b>打款单价：</b>${fm(dp)} → <b>打款总价：</b>${fm(data.driver_total_amount)}<br>
        <b>毛利/吨：</b>${fm(data.margin_per_ton||data.commission_per_ton)} → <b>毛利合计：</b><span style="color:var(--g);font-size:15px">${fm(data.margin_total||data.commission_total)}</span>
      </div>
      <div><b>💸 付款人：</b>${payer} | <b>📥 收款人：</b>${payee}</div>
      <div><b>📤 打款日：</b>${fd(data.settle_driver_date)} | <b>⏰ 承诺：</b>${fd(data.promised_driver_pay_date)}</div>
      <div><b>📥 回款日：</b>${fd(data.plant_pay_date)} | <b>📅 预计：</b>${fd(data.expected_plant_pay_date)}</div>
      <div><b>📝 备注：</b>${data.notes||'无'}</div></div>`;
  }else if(type==='vehicles'){
    const c=DB.q('orders',o=>o.vehicle_id===data.id).length;
    body=`<div style="font-size:13px;line-height:2.2">
      <div><b>🚛 车牌：</b>${data.plate_number} | <b>👨‍✈️ 司机：</b>${data.driver_name||'-'}</div>
      <div><b>📱 电话：</b>${data.driver_phone||'-'} | <b>🆔 身份证：</b>${data.driver_id_number||'-'}</div>
      <div><b>📍 地区：</b>${data.source_region||'-'} | <b>🏷️ 归属：</b>${data.ownership_type==='rent'?'租赁':data.ownership_type==='other'?'其他':'自有'}</div>
      <div><b>累计订单：</b>${c}单 | <b>📝 备注：</b>${data.notes||'无'}</div></div>`;
  }else if(type==='plants'){
    const ao=DB.q('orders',o=>o.plant_id===data.id);
    const mo=ao.filter(o=>o.order_date&&o.order_date.startsWith(cm()));
    body=`<div style="font-size:13px;line-height:2.2">
      <div><b>🏭 名称：</b>${data.name}</div>
      <div><b>📍 位置：</b>${data.city||''} ${data.address||''}</div>
      <div><b>📞 联系人：</b>${data.contact_person||'-'} ${data.contact_phone||''}</div>
      <div><b>⏱️ 结算周期：</b>${data.settlement_cycle_days||'7'}天</div>
      <div><b>📋 价格政策：</b>${data.price_policy||'无'}</div>
      <div><b>累计订单：</b>${ao.length}单 | <b>本月：</b>${mo.length}单</div></div>`;

function safeDel(title,detail,cb){
  const body=`<div style="text-align:center;padding:10px 0">

    <div style="font-weight:600;font-size:14px;margin-bottom:4px">${title}</div>

    <div style="color:var(--r);font-size:11px;display:none;margin-top:4px" id="sd_err">请输入"确认删除"</div></div>`;
  om('⚠️ 危险操作',body,()=>{
    if(document.getElementById('sd_input').value.trim()!=='确认删除'){document.getElementById('sd_err').style.display='block';return}
    cm();cb();
  });
  setTimeout(()=>{
    const inp=document.getElementById('sd_input'),btn=document.getElementById('msb');
    if(inp&&btn){btn.disabled=true;btn.style.opacity='.5';inp.addEventListener('input',()=>{if(inp.value.trim()==='确认删除'){btn.disabled=false;btn.style.opacity='1'}else{btn.disabled=true;btn.style.opacity='.5'}})}
  },100);
}

function computeAlerts(){
  const n=today(),r=[],ords=DB.all('orders'),cap=DB.all('capital'),pls=DB.all('plants');
  const up=ords.filter(o=>{const s=o.settle_status||infer(o.settle_driver_date,o.plant_pay_date);return s==='paid_unreceived';});
  for(const o of up){
    const p=DB.get('plants',o.plant_id),v=DB.get('vehicles',o.vehicle_id);
    const cy=p?p.settlement_cycle_days:7,sd=o.settle_driver_date||o.order_date;
    const ex=o.expected_plant_pay_date||addDays(sd,cy),ov=db(ex,n);
    const lv=ov>7?'urgent':ov>3?'warn':'info';
    r.push({id:'ap_'+o.id,type:'plant_pay',level:lv,icon:ov>0?'🔴':'🟡',title:`${ov>0?'⚠️ 超期'+ov+'天未回款':'📌 应回款'} - ${p?p.name:'?'}`,detail:`车牌：${v?v.plate_number:'?'} | 金额：${fm(o.total_amount)} | 预计：${fd(ex)}`,link:`orders:${o.id}`,ts:nowISO()});
  }
  const pp=ords.filter(o=>{const s=o.settle_status||infer(o.settle_driver_date,o.plant_pay_date);return s==='unpaid_unreceived'||s==='received_unpaid';});
  for(const o of pp){const v=DB.get('vehicles',o.vehicle_id),pr=o.promised_driver_pay_date;if(!pr)continue;const ov=db(pr,n);if(ov>=-3){const lv=ov>0?'urgent':ov>=-2?'warn':'info';r.push({id:'ad_'+o.id,type:'driver_pay',level:lv,icon:ov>0?'🔴':'🟡',title:`${ov>0?'🚨 应付司机款超期':'⏰ 应付司机款'} - ${v?v.plate_number:'?'}`,detail:`金额：${fm(o.total_amount)} | 承诺：${fd(pr)}`,link:`orders:${o.id}`,ts:nowISO()});}}
  for(const c of cap){if(c.status!=='active'||!c.expected_repay_date)continue;const ov=db(c.expected_repay_date,n);if(ov>=-7){const lv=ov>0?'urgent':ov>=-3?'warn':'info';r.push({id:'al_'+c.id,type:'loan',level:lv,icon:ov>0?'🔴':'🟡',title:`${ov>0?'🚨 借款超期':'📅 借款将到期'} - ${c.source_name}`,detail:`金额：${fm(c.amount)} | 到期：${fd(c.expected_repay_date)}`,link:`capital:${c.id}`,ts:nowISO()});}if(c.next_interest_date){const ov2=db(c.next_interest_date,n);if(ov2>=-5)r.push({id:'ai_'+c.id,type:'interest',level:ov2>0?'urgent':ov2>=-3?'warn':'info',icon:'💸',title:`${ov2>0?'⚠️ 利息超期':'付息提醒'} - ${c.source_name}`,detail:`到期：${fd(c.next_interest_date)}`,link:`capital:${c.id}`,ts:nowISO()});}}
  for(const p of pls){if(p.price_effective_date&&p.price_policy){const lf=db(n,p.price_effective_date);if(lf>=-3&&lf<=14)r.push({id:'apr_'+p.id,type:'price',level:lf<=3?'warn':'info',icon:'📋',title:`${lf<=0?'📢 价格生效':'价格将生效'} - ${p.name}`,detail:p.price_policy,link:`plants:${p.id}`,ts:nowISO()});}}
  const lu=up.filter(o=>db(o.settle_driver_date||o.order_date,n)>14);
  if(lu.length>0)r.push({id:'alu_'+today(),type:'long',level:'urgent',icon:'🔴',title:`🚨 ${lu.length}笔超14天未回款！`,detail:`金额：${fm(lu.reduce((s,o)=>s+(parseFloat(o.total_amount)||0),0))}`,link:'orders?status=paid_unreceived',ts:nowISO()});
  for(const py of DB.all('payers')){if(!py.pay_limit||py.pay_limit<=0)continue;const used=ords.filter(o=>{const s=o.settle_status||infer(o.settle_driver_date,o.plant_pay_date);return(o.payer_id===py.id||o.payee_id===py.id)&&(s==='paid_unreceived'||s==='completed')&&o.order_date&&o.order_date.startsWith(new Date().getFullYear().toString());}).reduce((s,o)=>s+(parseFloat(o.total_amount)||0),0);if(used>py.pay_limit*0.8)r.push({id:'apl_'+py.id,type:'pay_limit',level:used>=py.pay_limit?'urgent':'warn',icon:'🟡',title:`${used>=py.pay_limit?'🚨 超额！':'⚠️ 接近上限'} - ${py.name}`,detail:`已用${fm(used)}/额度${fm(py.pay_limit)}`,link:'payers',ts:nowISO()});}
  const ord={urgent:0,warn:1,info:2};r.sort((a,b)=>(ord[a.level]-ord[b.level])||new Date(b.ts)-new Date(a.ts));return r;
}

)">本季(单)</div></div><div><div style="font-weight:700">${yo.length}</div><div style="font-size:10px;color:var(--t2)">本年(单)</div></div><div>${fn(mo.reduce((s,o)=>s+(parseFloat(o.net_weight)||0),0))}吨</div><div>${fn(qo.reduce((s,o)=>s+(parseFloat(o.net_weight)||0),0))}吨</div><div>${fn(yo.reduce((s,o)=>s+(parseFloat(o.net_weight)||0),0))}吨</div><div>${fm(mo.reduce((s,o)=>s+(parseFloat(o.total_amount)||0),0))}</div><div>${fm(qo.reduce((s,o)=>s+(parseFloat(o.total_amount)||0),0))}</div><div>${fm(yo.reduce((s,o)=>s+(parseFloat(o.total_amount)||0),0))}</div></div><div style="margin-top:8px">${actionBtns(p.id,'plants')}</div></div></div>`}).join('')||'<div class="empty" style="grid-column:1/-1">暂无</div>'}</div>`}
function openPlantForm(p){const ie=!!p,data=p||{};const body=`<div class="fg"><label>🏭 名称 *</label><input type="text" id="fp_name" value="${data.name||''}"></div><div class="fr"><div class="fg"><label>🏙️ 城市</label><input type="text" id="fp_city" value="${data.city||''}"></div><div class="fg"><label>📌 地址</label><input type="text" id="fp_addr" value="${data.address||''}"></div></div><div class="fr"><div class="fg"><label>👤 联系人</label><input type="text" id="fp_cp" value="${data.contact_person||''}"></div><div class="fg"><label>📱 电话</label><input type="tel" id="fp_cph" value="${data.contact_phone||''}"></div></div><div class="fg"><label>⏱️ 结算周期(天)</label><input type="number" id="fp_cy" value="${data.settlement_cycle_days||'7'}"></div><div class="fg"><label>📋 价格政策</label><textarea id="fp_pp">${data.price_policy||''}</textarea></div><div class="fg"><label>📅 价格生效日</label><input type="date" id="fp_ped" value="${data.price_effective_date||''}"></div><div class="fg"><label>📝 备注</label><textarea id="fp_notes">${data.notes||''}</textarea></div>`;om(ie?'编辑钢厂':'新增钢厂',body,()=>{const r={id:ie?data.id:DB.gid(),name:document.getElementById('fp_name').value.trim(),city:document.getElementById('fp_city').value.trim(),address:document.getElementById('fp_addr').value.trim(),contact_person:document.getElementById('fp_cp').value.trim(),contact_phone:document.getElementById('fp_cph').value.trim(),settlement_cycle_days:parseInt(document.getElementById('fp_cy').value)||7,price_policy:document.getElementById('fp_pp').value.trim(),price_effective_date:document.getElementById('fp_ped').value,notes:document.getElementById('fp_notes').value.trim(),created_at:data.created_at||nowISO()};if(!r.name){st('请填名称');return}DB.save('plants',r);cm();render();st(ie?'已更新':'已添加')})}

// ==================== 资金 ====================
function rc(m){const cap=DB.all('capital'),ords=DB.all('orders'),n2=today();const ac=cap.filter(c=>c.status==='active'||!c.status);const ta=ac.reduce((s,c)=>s+(parseFloat(c.amount)||0),0);const of=ac.filter(c=>c.source_type==='own');const od=of.filter(c=>c.flow_type==='deposit'||!c.flow_type).reduce((s,c)=>s+(parseFloat(c.amount)||0),0);const ow=of.filter(c=>c.flow_type==='withdrawal').reduce((s,c)=>s+(parseFloat(c.amount)||0),0);const on=od-ow;const pp2=ords.filter(o=>{const s=o.settle_status||infer(o.settle_driver_date,o.plant_pay_date);return s==='unpaid_unreceived'||s==='received_unpaid';}).reduce((s,o)=>s+(parseFloat(o.total_amount)||0),0);const dr=ac.filter(c=>c.source_type!=='own'&&c.expected_repay_date&&c.expected_repay_date<=n2).reduce((s,c)=>s+(parseFloat(c.amount)||0),0);const ua2=ords.filter(o=>{const s=o.settle_status||infer(o.settle_driver_date,o.plant_pay_date);return s==='paid_unreceived';}).reduce((s,o)=>s+(parseFloat(o.total_amount)||0),0);const sv=ta-pp2-dr;const rm2={'lump_sum':'到期本息','equal_install':'等额本息','interest_only':'先息后本','revolving':'循环使用'};m.innerHTML=`<div class="dg"><div class="dc" style="background:#eff6ff"><div class="num" style="color:var(--p)">${fm(ta)}</div><div class="lbl">使用中总额度</div><div class="sn">${ac.length}笔</div></div><div class="dc" style="background:#f0fdf4"><div class="num s">${fm(ta)}</div><div class="lbl">流动资金</div></div><div class="dc" style="background:#fff7ed"><div class="num w">${fm(pp2)}</div><div class="lbl">待付款</div></div><div class="dc" style="background:#fef2f2"><div class="num d">${fm(dr)}</div><div class="lbl">待还款</div></div><div class="dc" style="background:#fffbeb"><div class="num w">${fm(ua2)}</div><div class="lbl">未回款</div></div></div><div class="dg"><div class="dc" style="background:#f5f3ff"><div class="num" style="color:#7c3aed">${fm(on)}</div><div class="lbl">自有资金净额</div><div class="sn">存入${fm(od)} · 支取${fm(ow)}</div></div><div class="dc" style="background:${sv>0?'#f0fdf4':'#fef2f2'}"><div class="num ${sv>0?'s':'d'}">${fm(sv)}</div><div class="lbl">偿债能力余额</div><div class="sn">${sv>0?'安全':'资金紧张⚠️'}</div></div></div><div class="fb no-print"><span style="font-size:12px;color:var(--t2)">${cap.length}笔</span><span style="flex:1"></span><button class="btn bp bs" onclick="openCapitalForm()">+ 新增</button></div><div class="card"><div class="tw"><table><thead><tr><th>类型</th><th>来源</th><th>流动</th><th class="tr">金额</th><th>还款方式</th><th>利率</th><th class="tr">年利息</th><th>借款日</th><th>到期/还款日</th><th>状态</th><th class="no-print">操作</th></tr></thead><tbody>${cap.map(c=>{const tm={bank_loan:'银行',private_loan:'私人',own:'自有',other:'其他'},sm2={active:'<span class="bad bad-ur">使用中</span>',repaid:'<span class="bad bad-ok">已还清</span>'};const yi=(parseFloat(c.amount)||0)*(parseFloat(c.interest_rate)||0)/100;const fl=c.source_type==='own'?(c.flow_type==='withdrawal'?'⬇支取':'⬆存入'):'借款';return`<tr><td>${tm[c.source_type]||'?'}</td><td><b>${c.source_name||'-'}</b></td><td>${fl}</td><td class="tr">${fm(c.amount)}</td><td>${rm2[c.repayment_method]||(c.repayment_method||'到期本息')}</td><td>${c.interest_rate?c.interest_rate+'%':'-'}</td><td class="tr" style="color:${yi>0?'var(--r)':''}">${yi>0?fm(yi):'-'}</td><td>${fd(c.borrow_date)}</td><td>${c.expected_repay_date?fd(c.expected_repay_date):'<span style="color:var(--t2)">无期限</span>'}</td><td>${sm2[c.status]||sm2.active}</td><td class="no-print">${actionBtns(c.id,'capital')}</td></tr>`}).join('')||'<tr><td colspan="11" class="empty">暂无</td></tr>'}</tbody></table></div></div>`}
function openCapitalForm(c){const ie=!!c,data=c||{};const to=[['bank_loan','银行贷款'],['private_loan','私人借款'],['own','自有'],['other','其他']].map(([v,l])=>`<option value="${v}" ${data.source_type==v?'selected':''}>${l}</option>`).join('');const so=[['active','使用中'],['repaid','已还清']].map(([v,l])=>`<option value="${v}" ${data.status==v?'selected':''}>${l}</option>`).join('');const rm=[['lump_sum','到期本息'],['equal_install','等额本息'],['interest_only','先息后本'],['revolving','循环使用']].map(([v,l])=>`<option value="${v}" ${(data.repayment_method||'lump_sum')==v?'selected':''}>${l}</option>`).join('');const cyc=[['monthly','每月'],['quarterly','每季'],['annually','每年'],['once','一次性']].map(([v,l])=>`<option value="${v}" ${data.interest_pay_cycle==v?'selected':''}>${l}</option>`).join('');const body=`<div class="fr"><div class="fg"><label>📂 类型</label><select id="fc_type">${to}</select></div><div class="fg"><label>🏦 来源名称 *</label><input type="text" id="fc_name" value="${data.source_name||''}" placeholder="工商银行/张三"></div></div><div class="fg"><label>📂 流向(自有资金)</label><select id="fc_flow_type"><option value="deposit" ${(data.flow_type||'deposit')=='deposit'?'selected':''}>⬆ 存入</option><option value="withdrawal" ${data.flow_type=='withdrawal'?'selected':''}>⬇ 支取</option></select><span class="fh">选"自有"类型时生效</span></div><div class="fr3"><div class="fg"><label>💰 金额 *</label><input type="number" id="fc_amt" step="0.01" value="${data.amount||''}"></div><div class="fg"><label>📈 年利率(%)</label><input type="number" id="fc_rate" step="0.01" value="${data.interest_rate||''}"></div><div class="fg"><label>🔄 还款方式</label><select id="fc_rm">${rm}</select></div></div><div class="fr3"><div class="fg"><label>📅 借款日</label><input type="date" id="fc_bd" value="${data.borrow_date||today()}"></div><div class="fg"><label>⏰ 到期日</label><input type="date" id="fc_erd" value="${data.expected_repay_date||''}"></div><div class="fg"><label>✅ 实际还清日</label><input type="date" id="fc_ard" value="${data.actual_repay_date||''}"></div></div><div class="fr"><div class="fg"><label>🔄 付息周期</label><select id="fc_ipc">${cyc}</select></div><div class="fg"><label>📅 下次付息</label><input type="date" id="fc_nid" value="${data.next_interest_date||''}"></div></div><div class="fg"><label>📌 状态</label><select id="fc_status">${so}</select></div><div class="fg"><label>📝 备注</label><textarea id="fc_notes">${data.notes||''}</textarea></div>`;om(ie?'编辑资金':'新增资金',body,()=>{const r={id:ie?data.id:DB.gid(),source_type:document.getElementById('fc_type').value,source_name:document.getElementById('fc_name').value.trim(),amount:parseFloat(document.getElementById('fc_amt').value)||0,interest_rate:parseFloat(document.getElementById('fc_rate').value)||0,repayment_method:document.getElementById('fc_rm').value,flow_type:document.getElementById('fc_flow_type')?.value||'deposit',borrow_date:document.getElementById('fc_bd').value,expected_repay_date:document.getElementById('fc_erd').value,actual_repay_date:document.getElementById('fc_ard').value,interest_pay_cycle:document.getElementById('fc_ipc').value,next_interest_date:document.getElementById('fc_nid').value,status:document.getElementById('fc_status').value,notes:document.getElementById('fc_notes').value.trim(),created_at:data.created_at||nowISO()};if(!r.source_name||!r.amount){st('请填来源和金额');return}DB.save('capital',r);cm();render();st(ie?'已更新':'已添加')})}

// ==================== 联系人 ====================
const ROLE_TREE={'工厂':['结算员','采购经理','财务','质检员','信息员','厂长'],'团队':['总经理','收款账户','付款账户','业务经理'],'供货商':['货主','二道贩子','物流司机']};
function getRoleCategory(rn){for(const[cat,roles]of Object.entries(ROLE_TREE)){if(roles.includes(rn))return cat}return'供货商'}
function rpy(m){const py=DB.all('payers'),ps=DB.all('plants'),n=today(),ords=DB.all('orders');const o2={'工厂':0,'团队':1,'供货商':2};py.sort((a,b)=>(o2[getRoleCategory(a.role_name||a.role)]-o2[getRoleCategory(b.role_name||b.role)])||a.name.localeCompare(b.name,'zh'));let cur='',html='';for(const p of py){const rc=getRoleCategory(p.role_name||p.role);if(rc!==cur){cur=rc;html+=`<div style="grid-column:1/-1;font-weight:700;font-size:13px;padding:8px 0 4px;color:var(--p);border-bottom:2px solid var(--p);margin-bottom:4px">${rc==='工厂'?'🏭':rc==='团队'?'👥':'🚚'} ${rc}</div>`}const rOrd=ords.filter(o=>o.payer_id===p.id||o.payee_id===p.id||(p.plant_id&&o.plant_id===p.plant_id));const r1m=rOrd.filter(o=>o.order_date&&db(o.order_date,n)<=30).length,r6m=rOrd.filter(o=>o.order_date&&db(o.order_date,n)<=180).length,r1y=rOrd.filter(o=>o.order_date&&db(o.order_date,n)<=365).length;const lo=rOrd.sort((a,b)=>new Date(b.order_date)-new Date(a.order_date))[0],ld=lo?db(lo.order_date,n):999;const al=ld<=7?'hot':ld<=30?'warm':ld<=180?'cold':'dead',aco={hot:'var(--g)',warm:'var(--w)',cold:'#94a3b8',dead:'#cbd5e1'},ala={hot:'近期活跃',warm:'一月内',cold:'半年内',dead:'半年以上'};const pl=p.plant_id?DB.get('plants',p.plant_id):null;const yrUsed=ords.filter(o=>{const s=o.settle_status||infer(o.settle_driver_date,o.plant_pay_date);return(o.payer_id===p.id||o.payee_id===p.id)&&(s==='paid_unreceived'||s==='completed')&&o.order_date&&o.order_date.startsWith(new Date().getFullYear().toString());}).reduce((s,o)=>s+(parseFloat(o.total_amount)||0),0);const inv=p.reverse_invoice_amount||0;html+=`<div class="card" style="margin:0"><div class="ch"><h3>${p.role_icon||'👤'} ${p.name}</h3><span style="font-size:11px;color:${aco[al]}">● ${ala[al]}</span></div><div class="cb" style="font-size:12px"><div>🎭 ${p.role_name||p.role||''} ${pl?`| 🏭 ${pl.name}`:''}</div><div>📞 ${p.phone||'无联系方式'}</div>${p.bank_accounts&&p.bank_accounts.length>0?`<div style="margin:4px 0;padding:4px 8px;background:#f8fafc;border-radius:4px;font-size:11px">🏦
